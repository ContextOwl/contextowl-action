name: "ContextOwl Publish"
description: "Publish your docs, changelog, and OpenAPI reference to ContextOwl from CI."
author: "ContextOwl"
branding:
  icon: "book-open"
  color: "purple"

inputs:
  token:
    description: "ContextOwl agent key. It starts with cowl_pat_. Pass it from an encrypted secret, for example secrets.CONTEXTOWL_PAT."
    required: true
  server-url:
    description: "Base URL of your ContextOwl instance. The action appends /api/v1."
    required: false
    default: "https://contextowl.co"
  config:
    description: "Path to the .contextowl.yml config file, relative to the repo root."
    required: false
    default: ".contextowl.yml"
  workspace:
    description: "Target workspace id or slug. Overrides the config file. Omit if the token is workspace-bound."
    required: false
    default: ""
  prune:
    description: "Remove content no longer present in the repo (docs are deprecated, changelog entries deleted). Off by default."
    required: false
    default: "false"
  dry-run:
    description: "Compute and print the plan without making any changes."
    required: false
    default: "false"
  fail-on-error:
    description: "Fail the job when an item fails to sync. The action writes the job summary first. Set it to false to report failed items as warnings. An error that stops a whole surface, such as a rejected key, always fails the job."
    required: false
    default: "true"

outputs:
  created:
    description: "Number of items created."
  updated:
    description: "Number of items updated."
  deleted:
    description: "Number of items deleted or deprecated by prune."
  skipped:
    description: "Number of unchanged items skipped."
  failed:
    description: "Number of items that failed to sync."

runs:
  using: "node24"
  main: "dist/index.mjs"
