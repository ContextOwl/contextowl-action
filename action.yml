name: "ContextOwl Publish"
description: "Publish your docs, changelog, and OpenAPI reference to ContextOwl from CI."
author: "ContextOwl"
branding:
  icon: "book-open"
  color: "purple"

inputs:
  token:
    description: "ContextOwl agent key. It starts with cowl_pat_. Pass it from an encrypted secret, for example secrets.CONTEXTOWL_PAT. When the organization reviews agent changes, approve the key as a publishing key in Admin > Settings > API. Without the approval, changes to live content wait in Admin > Proposals."
    required: true
  server-url:
    description: "Base URL of your ContextOwl instance. The action appends /api/v1."
    required: false
    default: "https://contextowl.co"
  config:
    description: "Path to the .contextowl.yml config file, relative to the repo root. In the changelog file, the ### subsections Added, Changed, Deprecated, Removed, Fixed and Security map to the tags new, improved, deprecated, deprecated, fixed and security. The match ignores case. Other subsection names get no tag and a warning."
    required: false
    default: ".contextowl.yml"
  workspace:
    description: "Target workspace id or slug. Overrides the config file. Omit if the token is workspace-bound."
    required: false
    default: ""
  prune:
    description: "Remove content no longer present in the repo (docs are deprecated, changelog entries deleted). Off by default."
    required: false
    default: "false"
  dry-run:
    description: "Compute and print the plan without making any changes."
    required: false
    default: "false"
  fail-on-error:
    description: "Fail the job when an item fails to sync. The action writes the job summary first. Set it to false to report failed items as warnings. An error that stops a whole surface, such as a rejected key, always fails the job."
    required: false
    default: "true"
  allow-shrink:
    description: "Accept a new article body that removes more than half of the current text and more than 2,000 characters. The server refuses such a body to guard against a broken file. When this is false, the article keeps its current body and counts as a failed item."
    required: false
    default: "false"

outputs:
  created:
    description: "Number of items created."
  updated:
    description: "Number of items updated."
  deleted:
    description: "Number of items deleted or deprecated by prune."
  skipped:
    description: "Number of unchanged items skipped."
  failed:
    description: "Number of items that failed to sync. A surface that stops before it finishes, for example after a rejected key, counts as 1."
  proposed:
    description: "Number of items with a change that waits for review in Admin > Proposals. The server answers 202 to such a change when the organization reviews agent changes and the key is not a publishing key. These items count in no other output."

runs:
  using: "node24"
  main: "dist/index.mjs"
